<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>paragrafos</title>
</head>
<body>
    <h1>exemplos de textos</h1>
    <hr>
    <p>voçe pode escrever um paragrafos
        de qualquer jeito.
        Basta colocar tudo
        no meio do par  de tags
        &lt;p&gt; e &lt;/p&gt;
    </p>
    <h3>gostou</h3>
    <p>se precisar quebrar 
        o texto em algum lugar
        espcífico &lt;br&gt; como esse,
        voçe pode usar  a tag &lt;br&gt;. 
    </p>
    <h3>símbolos</h3>
    <p>
        $reg;
        <br>
        $copy;
        <br>
        &yen;
        <br>
        &pound;
        <br>
        &euro;
        <br>
        $cent;
        <br>
        &Delta;
    </p>
</body>
</html>
