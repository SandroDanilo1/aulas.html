    <title>videos com HTML5</title>

<body>
    <h1>Inserindo videos hospedados localmente</h1>
    <P>este video está hospedado no meu servidor</P>
     <video width="500" poster="imagem/foto.jpg" controls>
        <source src="midea/video.mkv.mkv" type="video/mkv">
        <source src="midea/video.mkv.mkv" type="video/mkv">
         <source src="midea/video.webm.webm" type="video/webm">
          <source src="midea/video.gif.gif" type="video/gif">
          <p>o seu navegador não tem compactibilidade com reprodução de videos.</p>
      </video>
   <!-- essa maneira de por video no seu site pode deixar ele mais pesado e pode gerar mais gastos para o clinte apenas quando o site estiver hospedado-->

   <p>a outra forma de adicionar videos no seu site é copiando o link do video no seu site a link pode ser de qualquer plataforma como o youtube ou o vimeo,facebook ou até mesmo na internet.</p>
</body>
