<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo classe</title>
    <style>
     body{
        font-family:Arial,Helvetica,sans-serif;
    }
    div > p {
        display: none;
    }
    div:hover > p {
        display: block;
        color: white;
        background-color: black;

    }
    div:hover{
        color: black ;
    }
    </style>
</head> 
<body>
   <h1>Exemplo de hover</h1>
   <p>passe o mouse em baixo</p>
   <div>Passe o mouse aqui
    <p>Texto escondido</p>
   </div>
</body>
</html>
