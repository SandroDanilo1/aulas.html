<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moddelos de caixa</title>
    <style>
        h1{
             
            text-align: center;
            padding-top:10px;
            padding-right: 10px;
            padding-left: 10px;
            background-color: lightgray;
            height: 300px;
            width: 400px;
            border-width: 10px;
            border-style:solid ;
            border-color:darkslategray ;
        }
        h1:hover{
           
        }
        a{
            margin-top:20px;
            padding-bottom: 10px;
            padding-top: 10px;
            padding-right: 10px;
            padding-left: 10px;
            border-width: 10px;
            border-style: solid;
            color: yellowgreen;
            box-shadow: 1px 1px 1px 1px black;
            border-radius: 0%;
        }
        p{
            margin-bottom: 20px;
        }
        div > p {
            display:none ;
        }
        div:hover >p {
            
            margin-bottom:35px;
            display: block;
            border-style: solid;
             width: 400px;
             text-align: center;
             padding-bottom: 5px;
             padding-top: 5px;
             padding-right: 5px;
             padding-left: 5px;
             color:black;
             background-image:linear-gradient(to bottom,cyan,#ffffff);


        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box level</h1>
    <div>
        passe o mouse aqui
        <p>Sandro Danilo é o meu nome!
             é um prazer conhecer você!
            </p>
        
    </div>
    <p>parágrafos são exemplos de box-level,mas os <a href="#">liks são exeplos de caixas inline -level</a>. vamos ver como tudo isso funciona </p>
    
</body>
</html>
