<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags em HTMl</title>
</head>

<body>
    Em HTMl5 ,podemos inserir os elementod da list a seguir. passe o mouse sobre os termos para descobrir qual tag
    deverá utilizar em cada caso.
    <ul type="square">
        <li><abbr title="use a tag <p>">Paragrafo</abbr></li>
        <li><abbr title="use a tag <title>">Títulos</abbr></li>
        <li><abbr title="use a tag <img>">Imagens</abbr></li>
        <li><abbr title="use a tag <abbr>">Abreviações</abbr></li>
        <li><abbr title="use a tag <code>">Códigos-fonte</abbr></li>
        <li><abbr title="use a tag <ol>/<li>">Litas numeradas</abbr></li>
        <li><abbr title="use a tag <ul>/<li>"> Listas com demarcadores</abbr></li>
    </ul>
</body>

</html>
